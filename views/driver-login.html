<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Login - HIER</title>
    <link rel="stylesheet" href="/public/driver-login.css" />
</head>
<body>
    <div class="login-container">
       <form id="driverLoginForm" class="login-card">
            <div class="logo">🚗 HIER</div>

            <h1>Driver Login</h1>
            <p class="subtitle">Sign in to access your driver dashboard</p>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required />
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
                 <button type="submit" class="btn-login">Login</button>
                <!-- Familiar Forgot Password link -->
                <p class="forgot-link">
                    <a href="#" id="forgotPasswordLink">Forgot Password?</a>
                </p>
            </div>

            <p class="register-link">
                New driver?
                <a href="/views/driver-register.html">Join as Driver</a>
            </p>

            <p class="back-link">
                <a href="/views/index.html">← Back to Home</a>
            </p>
        </form>
    </div>

    <script>
    // Driver Login
    document.getElementById("driverLoginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:3000/login-driver", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();
        console.log(result);

        if (result.success) {
          localStorage.setItem("driver", JSON.stringify(result.driver));
          alert("Driver Login Successful");
          window.location.href = "/views/driver-dashboard.html";
        } else {
          alert(result.message);
        }
      } catch (err) {
        console.log(err);
        alert("Login Failed");
      }
    });

    // Forgot Password link logic
    document.getElementById("forgotPasswordLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      if (!email) {
        alert("Please enter your email first.");
        return;
      }

      try {
        const res = await fetch("http://localhost:3000/forgot-password-driver", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        alert(data.message);
      } catch (err) {
        console.error("FORGOT PASSWORD ERROR:", err);
        alert("Error requesting password reset.");
      }
    });
    </script>
</body>
</html>
